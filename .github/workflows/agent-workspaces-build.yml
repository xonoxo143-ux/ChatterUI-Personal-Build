name: Embedded Workspaces APK

on:
  workflow_dispatch:
  push:
    branches:
      - embedded-workspaces-v2
    paths:
      - 'app/**'
      - 'db/**'
      - 'lib/**'
      - 'modules/**'
      - 'expo-build-plugins/**'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'third_party_agent_runtime_binaries.sha256'
      - '.github/workflows/agent-workspaces-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      CI: '1'

    steps:
      - name: Checkout embedded workspace branch
        uses: actions/checkout@v5
        with:
          ref: embedded-workspaces-v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify embedded Linux payload
        run: |
          test -x modules/agent-workspace-runtime/android/src/main/assets/runtime/arm64-v8a/proot
          test -x modules/agent-workspace-runtime/android/src/main/assets/runtime/arm64-v8a/tar
          test -f modules/agent-workspace-runtime/android/src/main/jniLibs/arm64-v8a/libproot_loader.so
          sha256sum -c third_party_agent_runtime_binaries.sha256

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: embedded-workspaces-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
