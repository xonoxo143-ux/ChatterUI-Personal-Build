name: Generate Workspace Migration

on:
  push:
    branches:
      - embedded-workspaces-v2
    paths:
      - 'db/schema.ts'
      - '.github/workflows/workspace-migrations.yml'
      - 'scripts/update-migrations-bundle.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: embedded-workspaces-v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Drizzle migration
        run: |
          if [ ! -f db/migrations/0022_agent_workspaces_v2.sql ]; then
            npm run migrate -- --name agent_workspaces_v2
          fi
          node scripts/update-migrations-bundle.mjs

      - name: Commit generated migration
        run: |
          if git diff --quiet -- db/migrations; then
            echo "Migration bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations
          git commit -m "db: generate workspace migration"
          git push origin HEAD:embedded-workspaces-v2
